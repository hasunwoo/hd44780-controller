[package]
name = "rp2040-hd44780-basic"
version = "0.1.0"
edition = "2024"

[profile.release]
codegen-units = 1
debug-assertions = false
lto = "fat"
opt-level = 3
overflow-checks = false

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-executor = { version = "0.7.0", features = ["arch-cortex-m", "executor-interrupt", "executor-thread"] }
embassy-rp = { version = "0.4.0", features = ["boot2-generic-03h", "critical-section-impl", "rp2040", "time-driver"] }
embassy-time = "0.4.0"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
hd44780-controller = { version = "0.1.0-alpha.2", features = ["fmt", "pcf8574-device-async"] }
panic-halt = "1.0.0"
